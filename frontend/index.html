<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gmail Tasks Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.0/babel.min.js"></script>
  <style>
    :root {
      --bg-0: #070b12;
      --bg-1: #0d1522;
      --text-primary: #eaf1fb;
      --text-secondary: #9fb0c7;
      --text-muted: #6b7c95;
      --border-hair: rgba(255, 255, 255, 0.09);
      --glass-bg: rgba(255, 255, 255, 0.055);
      --glass-bg-hover: rgba(255, 255, 255, 0.09);
      --glass-border: rgba(255, 255, 255, 0.12);
      --accent: #5b8dff;
      --accent-soft: rgba(91, 141, 255, 0.16);
      --hi: #ff5c72;
      --md: #ffb23e;
      --lo: #6ee7b7;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-0: #eef2f9;
        --bg-1: #dfe6f2;
        --text-primary: #101828;
        --text-secondary: #445068;
        --text-muted: #6b7793;
        --border-hair: rgba(16, 24, 40, 0.08);
        --glass-bg: rgba(255, 255, 255, 0.55);
        --glass-bg-hover: rgba(255, 255, 255, 0.78);
        --glass-border: rgba(16, 24, 40, 0.1);
        --accent: #2f6bff;
        --accent-soft: rgba(47, 107, 255, 0.12);
        --hi: #e5384f;
        --md: #c9760a;
        --lo: #0f9d67;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg-0);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 15px; line-height: 1.6;
      overflow-x: hidden;
    }
    /* Cursor-reactive ambient background */
    #aurora {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(600px circle at var(--mx, 50%) var(--my, 35%), var(--accent-soft), transparent 60%),
        radial-gradient(800px circle at calc(100% - var(--mx, 50%)) calc(100% - var(--my, 40%)), rgba(110, 231, 183, 0.10), transparent 55%),
        linear-gradient(160deg, var(--bg-1), var(--bg-0));
      transition: background 0.25s ease-out;
    }
    @media (prefers-reduced-motion: reduce) {
      #aurora { transition: none; }
      * { animation: none !important; }
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.96) translateY(16px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
    }
    input[type="text"] {
      background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border);
      color: var(--text-primary); padding: 12px 16px; border-radius: 12px;
      font-size: 14px; font-family: inherit; transition: border-color .2s, box-shadow .2s;
      backdrop-filter: blur(8px);
    }
    input[type="text"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; width: 15px; height: 15px; }
    select {
      background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border);
      color: var(--text-primary); padding: 10px 12px; border-radius: 12px;
      font-size: 14px; font-family: inherit; cursor: pointer;
    }
    select:focus { outline: none; border-color: var(--accent); }
    ::placeholder { color: var(--text-muted); }
  </style>
</head>
<body>
  <div id="aurora"></div>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;
    const API_URL = '/api/tasks';

    const PRI = {
      high:   { text: 'var(--hi)', label: 'High',   glow: 'rgba(255,92,114,0.35)' },
      medium: { text: 'var(--md)', label: 'Medium', glow: 'rgba(255,178,62,0.30)' },
      low:    { text: 'var(--lo)', label: 'Low',    glow: 'rgba(110,231,183,0.28)' },
    };

    function dueLabel(due, isCompleted) {
      if (!due) return { text: 'No due date', overdue: false, muted: true };
      const d = new Date(due + 'T00:00:00');
      const days = Math.ceil((d - new Date()) / 86400000);
      const overdue = days < 0 && !isCompleted;
      if (overdue) return { text: `Overdue ${Math.abs(days)}d`, overdue: true };
      if (days <= 0) return { text: 'Due today', overdue: false };
      if (days <= 7) return { text: `Due in ${days}d`, overdue: false };
      return { text: due, overdue: false };
    }

    const TaskCard = ({ task, index, onClick, isCompleted }) => {
      const ref = useRef(null);
      const pri = PRI[task.priority || 'low'];
      const due = dueLabel(task.due_date, isCompleted);

      // Cursor-reactive tilt + spotlight
      const onMove = (e) => {
        const el = ref.current; if (!el) return;
        const r = el.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width;
        const py = (e.clientY - r.top) / r.height;
        el.style.setProperty('--rx', `${(0.5 - py) * 8}deg`);
        el.style.setProperty('--ry', `${(px - 0.5) * 8}deg`);
        el.style.setProperty('--sx', `${px * 100}%`);
        el.style.setProperty('--sy', `${py * 100}%`);
      };
      const onLeave = () => {
        const el = ref.current; if (!el) return;
        el.style.setProperty('--rx', '0deg');
        el.style.setProperty('--ry', '0deg');
        el.style.background = 'var(--glass-bg)';
        el.style.boxShadow = 'none';
      };
      const onEnter = () => {
        const el = ref.current; if (!el) return;
        el.style.background = `radial-gradient(340px circle at var(--sx) var(--sy), ${pri.glow}, var(--glass-bg-hover))`;
        el.style.boxShadow = `0 18px 50px -18px ${pri.glow}`;
      };

      return (
        <div ref={ref} onClick={onClick} onMouseMove={onMove} onMouseEnter={onEnter} onMouseLeave={onLeave}
          className="glass"
          style={{
            padding: '18px', cursor: 'pointer', display: 'flex', flexDirection: 'column', gap: '14px',
            animation: `rise 0.4s ease-out ${index * 0.04}s both`, opacity: isCompleted ? 0.45 : 1,
            transform: 'perspective(900px) rotateX(var(--rx,0)) rotateY(var(--ry,0))',
            transition: 'transform .15s ease-out, box-shadow .2s ease-out, background .2s ease-out',
            transformStyle: 'preserve-3d', position: 'relative',
          }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '12px' }}>
            <h3 style={{ margin: 0, fontSize: '15px', fontWeight: 500, lineHeight: 1.4, color: 'var(--text-primary)', textDecoration: isCompleted ? 'line-through' : 'none' }}>{task.title}</h3>
            <span style={{ flexShrink: 0, display: 'inline-flex', alignItems: 'center', gap: '6px', fontSize: '12px', fontWeight: 500, color: pri.text }}>
              <span style={{ width: 8, height: 8, borderRadius: '50%', background: pri.text, boxShadow: `0 0 10px ${pri.glow}` }} />
              {pri.label}
            </span>
          </div>
          <p style={{ margin: 0, fontSize: '13px', color: 'var(--text-secondary)', lineHeight: 1.55, display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{task.description}</p>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '12px', color: 'var(--text-muted)', marginTop: '2px' }}>
            <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '60%' }}>{task.sender}</span>
            <span style={{ color: due.overdue ? 'var(--hi)' : 'var(--text-muted)', fontWeight: due.overdue ? 600 : 400, fontStyle: due.muted ? 'italic' : 'normal' }}>{due.text}</span>
          </div>
        </div>
      );
    };

    const TaskModal = ({ task, isOpen, onClose, onToggleComplete, isCompleted }) => {
      if (!isOpen || !task) return null;
      const pri = PRI[task.priority || 'low'];
      const due = dueLabel(task.due_date, isCompleted);
      return (
        <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(3,6,12,0.6)', backdropFilter: 'blur(6px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: '20px' }}>
          <div onClick={(e) => e.stopPropagation()} className="glass" style={{ padding: '30px', maxWidth: '500px', width: '100%', animation: 'modalIn 0.3s ease', boxShadow: '0 30px 80px -20px rgba(0,0,0,0.6)' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: '16px', marginBottom: '18px' }}>
              <h2 style={{ margin: 0, fontSize: '19px', fontWeight: 500, lineHeight: 1.35, textDecoration: isCompleted ? 'line-through' : 'none' }}>{task.title}</h2>
              <button onClick={onClose} aria-label="Close" style={{ background: 'transparent', border: 'none', color: 'var(--text-muted)', fontSize: '22px', cursor: 'pointer', lineHeight: 1 }}>✕</button>
            </div>
            <p style={{ margin: '0 0 22px', fontSize: '14px', color: 'var(--text-secondary)', lineHeight: 1.65, paddingBottom: '20px', borderBottom: '1px solid var(--border-hair)' }}>{task.description}</p>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '18px', marginBottom: '24px' }}>
              <div><p style={{ margin: '0 0 6px', fontSize: '11px', letterSpacing: '0.05em', textTransform: 'uppercase', color: 'var(--text-muted)' }}>From</p><p style={{ margin: 0, fontSize: '14px', wordBreak: 'break-word' }}>{task.sender}</p></div>
              <div><p style={{ margin: '0 0 6px', fontSize: '11px', letterSpacing: '0.05em', textTransform: 'uppercase', color: 'var(--text-muted)' }}>Due</p><p style={{ margin: 0, fontSize: '14px', color: due.overdue ? 'var(--hi)' : 'var(--text-primary)', fontStyle: due.muted ? 'italic' : 'normal' }}>{task.due_date || 'No due date'}</p></div>
              <div><p style={{ margin: '0 0 6px', fontSize: '11px', letterSpacing: '0.05em', textTransform: 'uppercase', color: 'var(--text-muted)' }}>Priority</p><p style={{ margin: 0, fontSize: '14px', color: pri.text, fontWeight: 500 }}>{pri.label}</p></div>
              <div><p style={{ margin: '0 0 6px', fontSize: '11px', letterSpacing: '0.05em', textTransform: 'uppercase', color: 'var(--text-muted)' }}>Status</p><p style={{ margin: 0, fontSize: '14px', color: isCompleted ? 'var(--lo)' : 'var(--text-primary)' }}>{isCompleted ? 'Completed' : 'Pending'}</p></div>
            </div>
            <button onClick={onToggleComplete} style={{ width: '100%', padding: '13px', background: isCompleted ? 'transparent' : 'var(--accent)', border: isCompleted ? '1px solid var(--glass-border)' : 'none', color: isCompleted ? 'var(--text-secondary)' : '#fff', borderRadius: '12px', fontSize: '14px', fontWeight: 500, cursor: 'pointer', transition: 'all .2s' }}>
              {isCompleted ? 'Mark incomplete' : 'Mark complete'}
            </button>
          </div>
        </div>
      );
    };

    const Dashboard = () => {
      const [tasks, setTasks] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [error, setError] = useState(null);
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedPriorities, setSelectedPriorities] = useState(['high', 'medium', 'low']);
      const [sortBy, setSortBy] = useState('priority');
      const [expandedTask, setExpandedTask] = useState(null);
      const [completedTasks, setCompletedTasks] = useState(new Set());

      const fetchTasks = async () => {
        try {
          setError(null);
          const res = await fetch(API_URL);
          if (!res.ok) throw new Error(`API error: ${res.status}`);
          const data = await res.json();
          setTasks(data.tasks || []);
        } catch (err) { setError(err.message); }
      };

      useEffect(() => { (async () => { await fetchTasks(); setIsLoading(false); })(); }, []);

      // Cursor-reactive ambient background
      useEffect(() => {
        const el = document.getElementById('aurora');
        const onMove = (e) => {
          el.style.setProperty('--mx', `${(e.clientX / window.innerWidth) * 100}%`);
          el.style.setProperty('--my', `${(e.clientY / window.innerHeight) * 100}%`);
        };
        window.addEventListener('mousemove', onMove);
        return () => window.removeEventListener('mousemove', onMove);
      }, []);

      const handleRefresh = async () => { setIsRefreshing(true); await fetchTasks(); setIsRefreshing(false); };
      const togglePriority = (p) => setSelectedPriorities(prev => prev.includes(p) ? prev.filter(x => x !== p) : [...prev, p]);
      const toggleCompleted = (id) => setCompletedTasks(prev => { const s = new Set(prev); s.has(id) ? s.delete(id) : s.add(id); return s; });

      const filtered = useMemo(() => {
        const q = searchQuery.toLowerCase();
        const f = tasks.filter(t => {
          const ms = !q || t.title.toLowerCase().includes(q) || t.description.toLowerCase().includes(q) || t.sender.toLowerCase().includes(q);
          return ms && selectedPriorities.includes(t.priority);
        });
        const order = { high: 0, medium: 1, low: 2 };
        // Tasks with due dates sort before undated ones within the due-date sort.
        const dkey = (t) => (t.due_date ? new Date(t.due_date).getTime() : Infinity);
        return [...f].sort((a, b) => {
          if (sortBy === 'priority') { if (order[a.priority] !== order[b.priority]) return order[a.priority] - order[b.priority]; return dkey(a) - dkey(b); }
          if (sortBy === 'dueDate') return dkey(a) - dkey(b);
          if (sortBy === 'sender') return a.sender.localeCompare(b.sender);
          return 0;
        });
      }, [tasks, searchQuery, selectedPriorities, sortBy]);

      const counts = useMemo(() => ({
        high: tasks.filter(t => t.priority === 'high').length,
        medium: tasks.filter(t => t.priority === 'medium').length,
        low: tasks.filter(t => t.priority === 'low').length,
      }), [tasks]);

      return (
        <div style={{ minHeight: '100vh', padding: '32px 24px' }}>
          <div style={{ maxWidth: '1240px', margin: '0 auto' }}>
            <header style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', flexWrap: 'wrap', gap: '16px', marginBottom: '32px' }}>
              <div>
                <h1 style={{ margin: '0 0 4px', fontSize: '30px', fontWeight: 600, letterSpacing: '-0.02em' }}>Gmail Tasks</h1>
                <p style={{ margin: 0, fontSize: '13px', color: 'var(--text-muted)' }}>Created by Lakshay</p>
              </div>
              <button onClick={handleRefresh} disabled={isRefreshing} className="glass"
                style={{ padding: '10px 18px', color: 'var(--text-primary)', cursor: isRefreshing ? 'wait' : 'pointer', fontSize: '14px', fontWeight: 500, display: 'flex', alignItems: 'center', gap: '9px', borderRadius: '12px' }}>
                <span style={{ display: 'inline-block', animation: isRefreshing ? 'spin 0.8s linear infinite' : 'none', fontSize: '15px' }}>↻</span>
                {isRefreshing ? 'Refreshing…' : 'Refresh'}
              </button>
            </header>

            {error && (
              <div className="glass" style={{ borderColor: 'rgba(255,92,114,0.4)', color: 'var(--hi)', padding: '14px 18px', marginBottom: '24px', fontSize: '13px', borderRadius: '12px' }}>
                Couldn't reach the backend ({error}). Start it on port 8000 — see README.
              </div>
            )}

            <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0, 240px) minmax(0, 1fr)', gap: '24px', alignItems: 'start' }}>
              <aside className="glass" style={{ padding: '22px', position: 'sticky', top: '24px' }}>
                <p style={{ margin: '0 0 14px', fontSize: '11px', fontWeight: 600, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--text-muted)' }}>Priority</p>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '11px', marginBottom: '26px' }}>
                  {['high', 'medium', 'low'].map(p => (
                    <label key={p} style={{ display: 'flex', alignItems: 'center', gap: '10px', cursor: 'pointer', fontSize: '14px', color: 'var(--text-secondary)' }}>
                      <input type="checkbox" checked={selectedPriorities.includes(p)} onChange={() => togglePriority(p)} />
                      <span style={{ flex: 1 }}>{PRI[p].label}</span>
                      <span style={{ fontSize: '12px', color: PRI[p].text, fontVariantNumeric: 'tabular-nums' }}>{counts[p]}</span>
                    </label>
                  ))}
                </div>
                <p style={{ margin: '0 0 10px', fontSize: '11px', fontWeight: 600, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--text-muted)' }}>Sort by</p>
                <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} style={{ width: '100%' }}>
                  <option value="priority">Priority</option>
                  <option value="dueDate">Due date</option>
                  <option value="sender">Sender</option>
                </select>
              </aside>

              <main>
                <input type="text" placeholder="Search tasks, description, or sender" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} style={{ width: '100%', marginBottom: '18px' }} />
                <p style={{ margin: '0 0 18px', color: 'var(--text-secondary)', fontSize: '13px', fontVariantNumeric: 'tabular-nums' }}>
                  {isLoading ? 'Loading…' : `${filtered.length} task${filtered.length !== 1 ? 's' : ''} · ${completedTasks.size} completed`}
                </p>
                {isLoading ? (
                  <div style={{ textAlign: 'center', padding: '72px 24px', color: 'var(--text-muted)' }}>Loading tasks from your inbox…</div>
                ) : filtered.length === 0 ? (
                  <div style={{ textAlign: 'center', padding: '72px 24px', color: 'var(--text-muted)' }}>
                    {searchQuery || selectedPriorities.length < 3 ? 'No tasks match your filters.' : 'No pending tasks. All clear.'}
                  </div>
                ) : (
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(300px, 1fr))', gap: '18px' }}>
                    {filtered.map((task, idx) => (
                      <TaskCard key={task.id} task={task} index={idx} onClick={() => setExpandedTask(task)} isCompleted={completedTasks.has(task.id)} />
                    ))}
                  </div>
                )}
              </main>
            </div>
          </div>
          <TaskModal task={expandedTask} isOpen={!!expandedTask} onClose={() => setExpandedTask(null)} onToggleComplete={() => expandedTask && toggleCompleted(expandedTask.id)} isCompleted={expandedTask ? completedTasks.has(expandedTask.id) : false} />
        </div>
      );
    };

    ReactDOM.render(<Dashboard />, document.getElementById('root'));
  </script>
</body>
</html>
